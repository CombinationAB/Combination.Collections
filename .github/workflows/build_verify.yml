name: Build and verify

on:
  push:
    branches-ignore:
      - master
      - feature/*
  pull_request_target:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: (github.event_name == 'push' && github.actor != 'dependabot[bot]') || (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]')
    uses: Sports-Global/Infrastructure-Commons-Workflows/.github/workflows/build-common.yml@v1
    secrets: inherit

name: Cleanup deploy
on: delete

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'feature/')
    uses: Sports-Global/Infrastructure-Commons-Workflows/.github/workflows/cleanup-deployments.yml@v1
    secrets: inherit
